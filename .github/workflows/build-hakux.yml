# Coloque em .github/workflows/build-hakux.yml no SEU fork de rfandango/hakuX.
# Roda à mão: aba Actions > "Build hakuX (APK)" > Run workflow.
# Segue o android/README.md do hakuX: núcleo nativo (CMake + NDK 29), depois o APK (Gradle).
name: Build hakuX (APK)

on:
  push:
    branches: [master, feature/nvidia-image-scaling]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      apply_fsr:
        description: "Compatibilidade: aplicar o patch FSR caso o código ainda não o contenha"
        type: boolean
        default: true
      publish:
        description: "Publicar o APK numa Release (mais fácil de baixar no celular)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      NDK_VERSION: 29.0.14206865
      NC_DEPS: ${{ github.workspace }}/../native-deps
    steps:
      - name: Liberar espaço em disco
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Ferramentas (CMake, Ninja)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake python3 glslang-tools
          cmake --version

      - name: Android SDK 36 + NDK 29
        run: |
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            SDKM=$(find "$ANDROID_HOME" /usr/local/lib/android -name sdkmanager -type f 2>/dev/null | head -n1)
          fi
          echo "sdkmanager em: $SDKM"
          test -x "$SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.1.0" "ndk;${NDK_VERSION}"
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Submódulos (FEX, Arm NSS SDK e dependências)
        run: |
          git submodule update --init external/fex
          git -C external/fex submodule update --init External/fmt External/range-v3 \
            External/rpmalloc External/unordered_dense External/xxhash Source/Common/cpp-optparse
          git submodule update --init third_party/arm-neural-graphics-sdk
          git -C third_party/arm-neural-graphics-sdk submodule update --init --recursive

      - name: Dependências do núcleo (NC_DEPS, versões do README)
        run: |
          set -e
          mkdir -p "$NC_DEPS/root/subprojects"
          cd "$NC_DEPS"
          git clone --depth 1 --branch 1.4.304 https://github.com/zeux/volk.git volk
          git clone --depth 1 --branch 16.1.0 https://github.com/KhronosGroup/glslang.git glslang
          git clone --depth 1 --branch vulkan-sdk-1.4.328.0 https://github.com/KhronosGroup/SPIRV-Reflect.git spirv_reflect
          git clone --depth 1 --branch v3.3.0 https://github.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator.git vma
          git clone --depth 1 --branch release-3.4.18 https://github.com/libsdl-org/SDL.git SDL3
          git clone https://gitlab.freedesktop.org/slirp/libslirp.git libslirp
          git -C libslirp checkout 26be815b || git -C libslirp checkout v4.7.0
          NV2A_SHA=561fe80da57a881f89000256b459440c0178a7ce
          git init -q root/subprojects/nv2a_vsh_cpu
          OK=0
          for URL in https://github.com/xemu-project/nv2a_vsh_cpu.git https://github.com/abaire/nv2a_vsh_cpu.git; do
            git -C root/subprojects/nv2a_vsh_cpu remote remove origin 2>/dev/null || true
            git -C root/subprojects/nv2a_vsh_cpu remote add origin "$URL"
            if git -C root/subprojects/nv2a_vsh_cpu fetch -q --depth 1 origin "$NV2A_SHA"; then
              git -C root/subprojects/nv2a_vsh_cpu checkout -q FETCH_HEAD
              OK=1
              echo "nv2a_vsh_cpu $NV2A_SHA obtido de $URL"
              break
            fi
          done
          test "$OK" = 1
          git clone https://github.com/bylaws/libadrenotools.git adrenotools
          git -C adrenotools checkout 8fae8ce
          git -C adrenotools submodule update --init --recursive
          git -C adrenotools apply "$GITHUB_WORKSPACE/tools/native/adrenotools-kgsl-context-priority.patch"
          ls -la "$NC_DEPS"

      - name: Preparar shaders FSR 1.0 (sempre garantir o caminho FSR)
        run: |
          F=hw/xbox/hle/vk/swapchain.c
          if grep -q P_EASU "$F"; then
            echo "FSR já está no $F"
          else
            python3 tools/apply_fsr.py "$F"
          fi

      - name: Gravar a integração FSR 1.0 no código-fonte
        if: ${{ github.event_name == 'push' || inputs.apply_fsr }}
        run: |
          if ! grep -q P_EASU hw/xbox/hle/vk/swapchain.c; then
            echo "ERRO: o patch FSR não foi aplicado; não há alterações para gravar."
            exit 1
          fi
          if ! git diff --quiet -- hw/xbox/hle/vk/swapchain.c; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add hw/xbox/hle/vk/swapchain.c
            git commit -m "Integrate AMD FSR 1.0 into Vulkan presenter"
            git push origin HEAD:feature/nvidia-image-scaling
          else
            echo "FSR 1.0 já está gravado no código-fonte."
          fi

      - name: Diagnóstico (como o CMake usa NC_DEPS)
        run: |
          grep -rn "NC_DEPS" native --include=CMakeLists.txt --include=*.cmake | head -60 || true
          ls tools/native || true

      - name: Compilar o núcleo (hakuxcore)
        run: |
          cmake -S native -B build/native/core -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 -DCMAKE_BUILD_TYPE=Release \
            -DNC_DEPS="$NC_DEPS" \
            -DHAKUX_NSS_SDK=${{ (github.ref_name == 'feature/nvidia-image-scaling' || github.head_ref == 'feature/nvidia-image-scaling') && 'ON' || 'OFF' }}
          ninja -C build/native/core hakuxcore

      - name: Compilar Arm ML Emulation Layer para Android (NSS)
        if: ${{ github.ref_name == 'feature/nvidia-image-scaling' || github.head_ref == 'feature/nvidia-image-scaling' }}
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/third_party/arm-ml-emulation-layer-for-vulkan"
          DEPS="$RUNNER_TEMP/arm-mlel-deps"
          BUILD="$GITHUB_WORKSPACE/build/arm-mlel"
          PREFIX="$BUILD/install"
          mkdir -p "$DEPS"

          git clone --depth 1 https://github.com/arm/ai-ml-emulation-layer-for-vulkan.git "$ROOT"
          git -C "$ROOT" checkout 0b23341697bc11646b1ea6f10d08843069083c81

          for spec in \
            "glslang KhronosGroup/glslang" \
            "SPIRV-Cross KhronosGroup/SPIRV-Cross" \
            "SPIRV-Headers KhronosGroup/SPIRV-Headers" \
            "SPIRV-Tools KhronosGroup/SPIRV-Tools" \
            "Vulkan-Headers KhronosGroup/Vulkan-Headers"; do
            set -- $spec
            git clone --depth 1 --branch vulkan-sdk-1.4.357.0 "https://github.com/$2.git" "$DEPS/$1"
          done
          git clone --depth 1 --branch v3.12.0 https://github.com/nlohmann/json.git "$DEPS/json"

          cmake -S "$ROOT" -B "$BUILD" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_ALLOW_UNDEFINED_SYMBOLS=ON \
            -DANDROID_PIE=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DVMEL_USE_FLOAT_AS_DOUBLE=ON \
            -DVMEL_TESTS_ENABLE=OFF \
            -DGLSLANG_EXECUTABLE="$(command -v glslangValidator)" \
            -DGLSLANG_PATH="$DEPS/glslang" \
            -DSPIRV_CROSS_PATH="$DEPS/SPIRV-Cross" \
            -DSPIRV_HEADERS_PATH="$DEPS/SPIRV-Headers" \
            -DSPIRV_TOOLS_PATH="$DEPS/SPIRV-Tools" \
            -DVULKAN_HEADERS_PATH="$DEPS/Vulkan-Headers" \
            -DJSON_PATH="$DEPS/json"
          cmake --build "$BUILD" --target VkLayer_Graph VkLayer_Tensor --parallel 2
          cmake --install "$BUILD" --prefix "$PREFIX"
          test -s "$PREFIX/lib/libVkLayer_Graph.so"
          test -s "$PREFIX/lib/libVkLayer_Tensor.so"
          mkdir -p android/app/src/debug/jniLibs/arm64-v8a
          cp "$PREFIX/lib/libVkLayer_Graph.so" android/app/src/debug/jniLibs/arm64-v8a/
          cp "$PREFIX/lib/libVkLayer_Tensor.so" android/app/src/debug/jniLibs/arm64-v8a/
          echo "Arm NSS layers built and staged for the debug APK."
          ls -lh android/app/src/debug/jniLibs/arm64-v8a/libVkLayer_*.so

      - name: Copiar as bibliotecas para o app
        run: bash tools/native/app-libs.sh

      - name: Compilar o APK (debug, assinatura temporária)
        working-directory: android
        run: |
          chmod +x ./gradlew
          # Retry transient Maven Central / GitHub release gateway failures.
          for attempt in 1 2 3; do
            echo "Gradle build attempt $attempt/3"
            if ./gradlew assembleDebug --no-daemon --refresh-dependencies \
              -PciVersionCode="$GITHUB_RUN_NUMBER"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle failed; waiting 20 seconds before retry..."
              sleep 20
            fi
          done
          echo "Gradle build failed after 3 attempts."
          exit 1

      - name: Nomear o APK
        run: |
          APK=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n1)
          cp "$APK" hakuX-fsr-debug.apk
          ls -la hakuX-fsr-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: hakuX-nss-debug-apk
          path: hakuX-fsr-debug.apk

      - name: Publicar numa Release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fsr-build-${{ github.run_number }}
          name: hakuX FSR build ${{ github.run_number }}
          prerelease: true
          files: hakuX-fsr-debug.apk
