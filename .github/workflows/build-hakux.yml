# Build automatizado do hakuX: núcleo nativo (CMake + NDK 29) e APK (Gradle).
# A validação da branch de escalas não grava patches nem altera outras branches.
name: Build hakuX (APK)

on:
  push:
    branches: [master, feature/nvidia-image-scaling, feature/resolution-scales-1x-8x, feature/fractional-resolution-scales, feature/fractional-fsr-cas-validation]
  pull_request:
    branches: [master, feature/nvidia-image-scaling, feature/resolution-scales-1x-8x, feature/fractional-resolution-scales]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publicar o APK numa Release (deixe desativado durante os testes)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      NDK_VERSION: 29.0.14206865
      NC_DEPS: ${{ github.workspace }}/../native-deps
    steps:
      - name: Liberar espaço em disco
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          df -h /

      - uses: actions/checkout@v4

      - name: Configurar assinatura permanente para atualização por cima
        env:
          HAKUX_KEYSTORE_BASE64: ${{ secrets.HAKUX_KEYSTORE_BASE64 }}
          HAKUX_STORE_PASSWORD: ${{ secrets.HAKUX_STORE_PASSWORD }}
          HAKUX_KEY_ALIAS: ${{ secrets.HAKUX_KEY_ALIAS }}
          HAKUX_KEY_PASSWORD: ${{ secrets.HAKUX_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in HAKUX_KEYSTORE_BASE64 HAKUX_STORE_PASSWORD HAKUX_KEY_ALIAS HAKUX_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Secret obrigatório ausente: $name. Configure a chave permanente antes de gerar APK atualizável."
              exit 1
            fi
          done
          printf '%s' "$HAKUX_KEYSTORE_BASE64" | base64 --decode > android/hakuX-upload.jks
          test -s android/hakuX-upload.jks
          echo "HAKUX_SIGNING_READY=true" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Ferramentas (CMake, Ninja)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake python3 glslang-tools
          cmake --version

      - name: Validar shader compute NIS (SPIR-V Vulkan 1.1)
        run: |
          glslangValidator --version
          glslangValidator -V --target-env vulkan1.1 -S comp \
            -I"$GITHUB_WORKSPACE/third_party/NVIDIAImageScaling" \
            "$GITHUB_WORKSPACE/third_party/NVIDIAImageScaling/NIS_Main.glsl" \
            -o "$RUNNER_TEMP/nis_scaler.spv"
          test -s "$RUNNER_TEMP/nis_scaler.spv"

      - name: Android SDK 36 + NDK 29
        run: |
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            SDKM=$(find "$ANDROID_HOME" /usr/local/lib/android -name sdkmanager -type f 2>/dev/null | head -n1)
          fi
          echo "sdkmanager em: $SDKM"
          test -x "$SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.1.0" "ndk;${NDK_VERSION}"
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Submódulos (FEX e dependências)
        run: |
          git submodule update --init external/fex
          git -C external/fex submodule update --init External/fmt External/range-v3 \
            External/rpmalloc External/unordered_dense External/xxhash Source/Common/cpp-optparse

      - name: Dependências do núcleo (NC_DEPS, versões do README)
        run: |
          set -e
          mkdir -p "$NC_DEPS/root/subprojects"
          cd "$NC_DEPS"
          git clone --depth 1 --branch 1.4.304 https://github.com/zeux/volk.git volk
          git clone --depth 1 --branch 16.1.0 https://github.com/KhronosGroup/glslang.git glslang
          git clone --depth 1 --branch vulkan-sdk-1.4.328.0 https://github.com/KhronosGroup/SPIRV-Reflect.git spirv_reflect
          git clone --depth 1 --branch v3.3.0 https://github.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator.git vma
          git clone --depth 1 --branch release-3.4.18 https://github.com/libsdl-org/SDL.git SDL3
          git clone https://gitlab.freedesktop.org/slirp/libslirp.git libslirp
          git -C libslirp checkout 26be815b || git -C libslirp checkout v4.7.0
          NV2A_SHA=561fe80da57a881f89000256b459440c0178a7ce
          git init -q root/subprojects/nv2a_vsh_cpu
          OK=0
          for URL in https://github.com/xemu-project/nv2a_vsh_cpu.git https://github.com/abaire/nv2a_vsh_cpu.git; do
            git -C root/subprojects/nv2a_vsh_cpu remote remove origin 2>/dev/null || true
            git -C root/subprojects/nv2a_vsh_cpu remote add origin "$URL"
            if git -C root/subprojects/nv2a_vsh_cpu fetch -q --depth 1 origin "$NV2A_SHA"; then
              git -C root/subprojects/nv2a_vsh_cpu checkout -q FETCH_HEAD
              OK=1
              echo "nv2a_vsh_cpu $NV2A_SHA obtido de $URL"
              break
            fi
          done
          test "$OK" = 1
          git clone https://github.com/bylaws/libadrenotools.git adrenotools
          git -C adrenotools checkout 8fae8ce
          git -C adrenotools submodule update --init --recursive
          git -C adrenotools apply "$GITHUB_WORKSPACE/tools/native/adrenotools-kgsl-context-priority.patch"
          ls -la "$NC_DEPS"

      - name: Preparar shaders FSR 1.0 (sempre garantir o caminho FSR)
        run: |
          F=hw/xbox/hle/vk/swapchain.c
          if grep -q P_EASU "$F"; then
            echo "FSR já está no $F"
          else
            python3 tools/apply_fsr.py "$F"
          fi

      # Não gravar alterações de preparação FSR de volta no repositório.
      # O patch, se necessário, permanece apenas no workspace desta execução.

      - name: Diagnóstico (como o CMake usa NC_DEPS)
        run: |
          grep -rn "NC_DEPS" native --include=CMakeLists.txt --include=*.cmake | head -60 || true
          ls tools/native || true

      - name: Compilar o núcleo (hakuxcore)
        run: |
          cmake -S native -B build/native/core -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 -DCMAKE_BUILD_TYPE=Release \
            -DNC_DEPS="$NC_DEPS" \
            -DCMAKE_C_FLAGS_RELEASE="-O3 -DNDEBUG -g" \
            -DCMAKE_CXX_FLAGS_RELEASE="-O3 -DNDEBUG -g"
          ninja -C build/native/core hakuxcore

      # Preserve the exact unstripped ARM64 binaries for tombstone symbolization.
      - uses: actions/upload-artifact@v4
        name: Upload native symbols
        with:
          name: hakuX-native-symbols
          path: |
            build/native/core/libhakuxcore.so
            build/native/core/sdl3/libSDL3.so
          if-no-files-found: error
          retention-days: 14

      - name: Copiar as bibliotecas para o app
        run: bash tools/native/app-libs.sh

      - name: Compilar o APK (debug, assinatura permanente)
        working-directory: android
        env:
          HAKUX_STORE_PASSWORD: ${{ secrets.HAKUX_STORE_PASSWORD }}
          HAKUX_KEY_ALIAS: ${{ secrets.HAKUX_KEY_ALIAS }}
          HAKUX_KEY_PASSWORD: ${{ secrets.HAKUX_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          # Retry transient Maven Central / GitHub release gateway failures.
          for attempt in 1 2 3; do
            echo "Gradle build attempt $attempt/3"
            if ./gradlew assembleDebug --no-daemon --refresh-dependencies \
              -PciVersionCode="$GITHUB_RUN_NUMBER" \
              -PciStorePassword="$HAKUX_STORE_PASSWORD" \
              -PciKeyAlias="$HAKUX_KEY_ALIAS" \
              -PciKeyPassword="$HAKUX_KEY_PASSWORD"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle failed; waiting 20 seconds before retry..."
              sleep 20
            fi
          done
          echo "Gradle build failed after 3 attempts."
          exit 1

      - name: Nomear o APK
        run: |
          APK=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n1)
          cp "$APK" hakuX-debug.apk
          ls -la hakuX-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: hakuX-standard-debug-apk
          path: hakuX-debug.apk

      - name: Publicar numa Release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hakux-build-${{ github.run_number }}
          name: hakuX build ${{ github.run_number }}
          prerelease: true
          files: hakuX-debug.apk
